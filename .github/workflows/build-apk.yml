name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher (found $JAVA_MAJOR)."
            exit 1
          fi
          echo "Java environment verified: version $JAVA_MAJOR is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore and verify debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Using existing keystore."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "::warning::Neither debug.keystore nor debug.keystore.base64 found; generating temporary debug keystore (Google Sign-In SHA-1 will differ from Firebase config)."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to materialize ./debug.keystore"
            exit 1
          fi
          KEYSTORE_SHA1=$(keytool -list -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android | awk -F': ' '/^\s*SHA1:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Debug keystore SHA-1 (normalized): $KEYSTORE_SHA1"

      - name: Verify Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f "app/google-services.json" ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
              python3 - <<'PY'
          import base64, json, os, sys
          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              sys.exit(1)
          try:
              json.loads(raw)
              content = raw
          except Exception:
              decoded = base64.b64decode(raw).decode("utf-8")
              json.loads(decoded)
              content = decoded
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              f.write(content)
          PY
            else
              echo "::error::app/google-services.json is missing. Commit app/google-services.json to the repository or configure the GOOGLE_SERVICES_JSON GitHub Actions secret so the Google Services Gradle plugin can generate default_web_client_id."
              exit 1
            fi
          fi
          KEYSTORE_SHA1=$(keytool -list -v -keystore ./debug.keystore -alias androiddebugkey -storepass android -keypass android | awk -F': ' '/^\s*SHA1:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          export KEYSTORE_SHA1
          python3 - <<'PY'
          import json, os, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          target_pkg = "com.aistudio.nexustrading.gdhwsv"
          matching = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == target_pkg
          ]
          if not matching:
              print(f"::error::No Firebase client entry found for {target_pkg} in app/google-services.json", file=sys.stderr)
              sys.exit(1)
          has_web_client = any(
              oauth.get("client_type") == 3 and bool(oauth.get("client_id"))
              for c in matching
              for oauth in c.get("oauth_client", [])
          )
          if not has_web_client:
              print(f"::error::No Web OAuth client (client_type == 3) found for {target_pkg} in app/google-services.json; default_web_client_id cannot be generated.", file=sys.stderr)
              sys.exit(1)
          cert_hashes = [
              (oauth.get("android_info", {}).get("certificate_hash") or "").lower()
              for c in matching
              for oauth in c.get("oauth_client", [])
              if oauth.get("client_type") == 1
          ]
          ks_sha1 = os.environ.get("KEYSTORE_SHA1", "").lower()
          if ks_sha1 and ks_sha1 not in cert_hashes:
              print(f"::error::Debug keystore SHA-1 ({ks_sha1}) does not match any registered Android OAuth certificate_hash ({cert_hashes}) for {target_pkg}!", file=sys.stderr)
              sys.exit(1)
          print(f"Verified app/google-services.json Web OAuth client and matching SHA-1 ({ks_sha1}) for {target_pkg}.")
          PY

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension."; exit 1 ;;
          esac
          echo "APK successfully verified at $APK_PATH ($(stat -c%s "$APK_PATH") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_RELEASE_DIR/app-debug.apk"
          if [ ! -s "$TEMP_RELEASE_DIR/app-debug.apk" ]; then
            echo "Error: Prepared release APK is missing or empty."
            exit 1
          fi
          echo "asset_path=$TEMP_RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at $TEMP_RELEASE_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset does not end in .apk"; exit 1 ;;
          esac
          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "Error: Asset filename is not app-debug.apk (found $ASSET_FILENAME)"
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "### NEXUS TRADING AI - Debug APK Build
          - **Notice:** This is an automatically generated debug APK.
          - **Builder:** Built by GitHub Actions.
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Purpose:** Intended for testing.
          - **Status:** Not a Play Store production release. Signed only with a temporary debug keystore." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE SUCCESSFUL ==="
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page: https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release Asset: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions backup artifact 'app-debug-apk' remains available for download from this run."
            fi
            echo "Do not rely on the latest direct release link until a release completes successfully."
          fi
